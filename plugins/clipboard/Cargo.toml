[package]
name = "clipkeep-plugin-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = "3.6"
base64 = "0.22"
clipkeep-plugin-sdk = { path = "../../crates/clipkeep-plugin-sdk" }
clipkeep-protocol.workspace = true
directories = "6.0"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSString"] }

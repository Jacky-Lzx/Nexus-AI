[package]
name = "clipkeep-plugin-applications"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clipkeep-plugin-sdk = { path = "../../crates/clipkeep-plugin-sdk" }
clipkeep-protocol.workspace = true
directories = "6.0"
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSFileManager",
    "NSLocale",
    "NSString",
    "NSUserDefaults",
] }

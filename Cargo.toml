[package]
name = "clipkeep"
version = "0.1.0"
edition = "2024"
description = "A small, private, cross-platform clipboard history manager"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/clipkeep-core",
    "crates/clipkeep-plugin-sdk",
    "crates/clipkeep-protocol",
    "plugins/applications",
    "plugins/clipboard",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clipkeep-protocol = { path = "crates/clipkeep-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies]
clipkeep-core = { path = "crates/clipkeep-core" }
clipkeep-protocol.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }

[profile.release]
strip = true
lto = "thin"

[package]
name = "clipkeep"
version = "0.1.0"
edition = "2024"
description = "A small, private, cross-platform clipboard history manager"
license = "MIT"

[dependencies]
arboard = "3.6"
directories = "6.0"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = "thin"

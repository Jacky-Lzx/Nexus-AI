[workspace]
members = [
    "crates/clipkeep-core",
    "crates/clipkeep-plugin-sdk",
    "crates/clipkeep-protocol",
    "plugins/applications",
    "plugins/base-converter",
    "plugins/caffeinate",
    "plugins/calculator",
    "plugins/calendar",
    "plugins/clash",
    "plugins/clipboard",
    "plugins/color-tools",
    "plugins/cron-schedule",
    "plugins/date-calculator",
    "plugins/dns-lookup",
    "plugins/file-checksum",
    "plugins/files",
    "plugins/id-generator",
    "plugins/json-query",
    "plugins/jwt-inspector",
    "plugins/kill-process",
    "plugins/menu-bar",
    "plugins/network-calculator",
    "plugins/password-generator",
    "plugins/permission-calculator",
    "plugins/port-inspector",
    "plugins/quick-notes",
    "plugins/randomizer",
    "plugins/regex-tester",
    "plugins/reminders",
    "plugins/system-commands",
    "plugins/system-status",
    "plugins/text-diff",
    "plugins/text-tools",
    "plugins/time-date",
    "plugins/unicode-inspector",
    "plugins/unit-converter",
    "plugins/url-inspector",
    "plugins/web-search",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clipkeep-protocol = { path = "crates/clipkeep-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = "thin"
